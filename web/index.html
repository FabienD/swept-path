<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Épure de giration — swept-path</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-dvh bg-ink text-fg">
    <div class="hazard-band"></div>

    <!-- Two panes: what you measure on the left, what it gives you on the
         right. Below 820 px they stack, plan first — the answer should not
         sit under twenty inputs on a phone. -->
    <main class="grid lg:grid-cols-[300px_minmax(0,1fr)]">
      <!-- ─────────────────────────── settings ─────────────────────────── -->
      <aside class="order-2 border-line bg-panel p-5 lg:order-1 lg:min-h-dvh lg:border-r">
        <h1 class="text-xs tracking-[0.18em] text-dim uppercase">
          <span data-i18n="app.name"></span>
          <b class="font-semibold text-accent" data-i18n="app.nameAccent"></b>
        </h1>
        <p class="mt-3 text-sm text-dim" data-i18n="app.tagline"></p>

        <form id="params" class="mt-5 grid gap-5">
          <!-- Three subjects, and nothing after the button. Each one shows what
               you are asked for and folds away what it can work out or assume:
               the vehicle you drive, the gateway you aim at, the street you
               come down. -->

          <!-- ─────────────────────── the vehicle ─────────────────────── -->
          <section class="grid gap-2.5">
            <h2 class="text-[0.62rem] tracking-[0.16em] text-accent uppercase" data-i18n="section.vehicle"></h2>

            <div class="relative grid gap-1">
              <input
                id="vehicle-name"
                type="text"
                role="combobox"
                autocomplete="off"
                aria-expanded="false"
                aria-controls="vehicle-list"
                aria-autocomplete="list"
                data-i18n-placeholder="field.vehicleFilter"
                class="rounded border border-line bg-plan px-2 py-1.5 text-sm"
              />
              <ul
                id="vehicle-list"
                role="listbox"
                hidden
                class="absolute top-full right-0 left-0 z-10 mt-1 max-h-64 overflow-y-auto rounded border border-line bg-panel py-1 text-sm shadow-lg"
              ></ul>
              <span id="preset-note" class="text-xs text-dim"></span>
            </div>

            <details id="vehicle-box">
              <summary class="cursor-pointer text-xs text-dim marker:text-accent">
                <span data-i18n="fine.vehicle"></span>
                <span id="vehicle-missing" class="text-band-tight"></span>
              </summary>
              <div class="mt-3 grid grid-cols-2 gap-2.5">
                <label class="col-span-2 flex items-center gap-2">
                  <input id="mirrors-folded" type="checkbox" class="size-4 accent-accent" />
                  <span class="text-xs text-dim" data-i18n="mirrors.folded"></span>
                </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.wheelbase"></span> <span data-unit="dimension"></span></span>
              <input id="wheelbase" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.length"></span> <span data-unit="dimension"></span></span>
              <input id="length" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.frontOverhang"></span> <span data-unit="dimension"></span></span>
              <input id="front-overhang" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.bodyWidth"></span> <span data-unit="dimension"></span></span>
              <input id="body-width" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.mirrorWidth"></span> <span data-unit="dimension"></span></span>
              <input id="mirror-width" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.mirrorWidthFolded"></span> <span data-unit="dimension"></span></span>
              <input id="mirror-width-folded" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.groundClearance"></span> <span data-unit="dimension"></span></span>
              <input id="ground-clearance" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
                <label class="grid gap-1">
                  <span class="text-xs text-dim">
                    <span data-i18n="field.radius"></span>
                    <span data-unit="dimension"></span>
                    <span id="radius-note" class="text-dim"></span>
                  </span>
                  <input id="radius" data-magnitude="dimension" type="number" min="0" step="0.001" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
                </label>

                <!-- Derived, not entered: length minus wheelbase minus front
                     overhang. A fourth field would be a fourth number for three
                     degrees of freedom. Shown because it is what crosses the
                     gateway first when reversing in. -->
                <div class="col-span-2 flex items-baseline justify-between">
                  <span class="text-xs text-dim">
                    <span data-i18n="field.rearOverhang"></span>
                    <span class="opacity-70">— <span data-i18n="field.derived"></span></span>
                  </span>
                  <output id="rear-overhang" class="text-sm tabular-nums"></output>
                </div>
              </div>
            </details>
          </section>

          <!-- ─────────────────────── the gateway ─────────────────────── -->
          <section class="grid gap-2.5 border-t border-line pt-4">
            <h2 class="text-[0.62rem] tracking-[0.16em] text-accent uppercase" data-i18n="section.gate"></h2>

            <div class="grid grid-cols-2 gap-2.5">
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.opening"></span> <span data-unit="dimension"></span></span>
              <input id="opening" data-magnitude="dimension" type="number" min="0" step="0.01" value="2.40" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.posts"></span> <span data-unit="dimension"></span></span>
              <input id="post-width" data-magnitude="dimension" type="number" min="0" step="0.01" value="0.55" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            </div>

            <label class="grid gap-1">
              <span class="text-xs text-dim" data-i18n="field.gateKind"></span>
              <select id="gate-kind" class="rounded border border-line bg-plan px-2 py-1.5 text-sm">
                <option value="sliding" data-i18n="gate.sliding"></option>
                <option value="swinging" data-i18n="gate.swinging"></option>
              </select>
            </label>

            <details>
              <summary class="cursor-pointer text-xs text-dim marker:text-accent" data-i18n="fine.gate"></summary>
              <div class="mt-3 grid gap-3">
                <div class="grid grid-cols-2 gap-2.5">
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.postDepth"></span> <span data-unit="dimension"></span></span>
              <input id="post-depth" data-magnitude="dimension" type="number" min="0" step="0.01" value="0.55" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.wall"></span> <span data-unit="dimension"></span></span>
              <input id="wall" data-magnitude="dimension" type="number" min="0" step="0.01" value="0.30" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
                </div>

                <fieldset id="leaf-box" class="hidden gap-2.5">
                  <legend class="mb-1.5 text-[0.65rem] tracking-[0.13em] text-dim uppercase" data-i18n="group.leaves"></legend>
                  <div class="grid grid-cols-2 gap-2.5">
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.leafLength"></span> <span data-unit="dimension"></span></span>
              <input id="leaf-length" data-magnitude="dimension" type="number" min="0" step="0.01" value="1.15" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.leafThickness"></span> <span data-unit="dimension"></span></span>
              <input id="leaf-thickness" data-magnitude="dimension" type="number" min="0" step="0.001" value="0.04" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.hingeOffset"></span> <span data-unit="dimension"></span></span>
              <input id="hinge-offset" data-magnitude="dimension" type="number" min="0" step="0.001" value="0.035" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
                    <label class="grid gap-1">
                      <span class="text-xs text-dim" data-i18n="field.hingeDepth"></span>
                      <input id="hinge-depth" type="number" step="5" min="0" max="100" value="50" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
                    </label>
                  </div>
                  <label class="mt-2 grid gap-1">
                    <span class="text-xs text-dim">
                      <span data-i18n="field.openAngle"></span> — <span id="angle-value">93</span>°
                      <span id="angle-max" class="ml-1 text-dim"></span>
                    </span>
                    <input id="open-angle" type="range" min="70" max="180" step="1" value="93" class="w-full accent-accent" />
                  </label>
                </fieldset>
              </div>
            </details>
          </section>

          <!-- ─────────────────────── the street ──────────────────────── -->
          <section class="grid gap-2.5 border-t border-line pt-4">
            <h2 class="text-[0.62rem] tracking-[0.16em] text-accent uppercase" data-i18n="section.street"></h2>

            <div class="grid grid-cols-2 gap-2.5">
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.road"></span> <span data-unit="distance"></span></span>
              <input id="road" data-magnitude="distance" type="number" min="0" step="0.01" value="5.90" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.sidewalk"></span> <span data-unit="distance"></span></span>
              <input id="sidewalk" data-magnitude="distance" type="number" min="0" step="0.01" value="1.30" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            </div>

            <label class="grid gap-1">
              <span class="text-xs text-dim" data-i18n="field.side"></span>
              <select id="side" class="rounded border border-line bg-plan px-2 py-1.5 text-sm">
                <option value="1" data-i18n="side.fromLeft"></option>
                <option value="-1" data-i18n="side.fromRight"></option>
              </select>
            </label>

            <label class="grid gap-1">
              <span class="text-xs text-dim" data-i18n="field.direction"></span>
              <select id="direction" class="rounded border border-line bg-plan px-2 py-1.5 text-sm">
                <option value="any" data-i18n="direction.any"></option>
                <option value="forward" data-i18n="direction.forward"></option>
                <option value="reverse" data-i18n="direction.reverse"></option>
              </select>
            </label>

            <details>
              <summary class="cursor-pointer text-xs text-dim marker:text-accent" data-i18n="fine.street"></summary>
              <div class="mt-3 grid gap-3">
                <div class="grid grid-cols-2 gap-2.5">
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.curbCut"></span> <span data-unit="distance"></span></span>
              <input id="curb" data-magnitude="distance" type="number" min="0" step="0.01" value="3.20" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
            <label class="grid gap-1">
              <span class="text-xs text-dim"><span data-i18n="field.curbHeight"></span> <span data-unit="dimension"></span></span>
              <input id="curb-height" data-magnitude="dimension" type="number" min="0" step="0.01" value="0.12" class="w-full rounded border border-line bg-plan px-2 py-1.5 text-sm tabular-nums" />
            </label>
                </div>
                <button id="run-min-road" type="button" class="rounded border border-line px-3 py-1.5 text-xs text-dim" data-i18n="action.minRoad"></button>
              </div>
            </details>
          </section>

          <button id="run" type="submit" class="rounded bg-accent px-4 py-2.5 text-sm font-bold text-ink" data-i18n="action.compute"></button>
        </form>
      </aside>

      <!-- ───────────────────────────── plan ───────────────────────────── -->
      <section class="order-1 min-w-0 p-5 lg:order-2">
        <!-- How the answer is written, not what is being asked: these belong
             with the result rather than among the measurements. Bare and
             right-aligned, so they never compete with the verdict below. -->
        <div class="mb-4 flex justify-end gap-2 text-xs">
          <label class="flex items-center gap-1.5 text-dim">
            <span class="sr-only" data-i18n="settings.language"></span>
            <select
              id="locale"
              aria-label="Langue"
              data-i18n-aria="settings.language"
              class="rounded border border-line bg-transparent px-1.5 py-1 text-dim hover:text-fg"
            >
              <option value="fr">Français</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="flex items-center gap-1.5 text-dim">
            <span class="sr-only" data-i18n="settings.units"></span>
            <select
              id="units"
              aria-label="Unités"
              data-i18n-aria="settings.units"
              class="rounded border border-line bg-transparent px-1.5 py-1 text-dim hover:text-fg"
            >
              <option value="metric" data-i18n="units.metric"></option>
              <option value="us" data-i18n="units.us"></option>
            </select>
          </label>
        </div>

        <div class="flex flex-wrap items-end gap-x-10 gap-y-4">
          <output id="verdict" class="block">
            <span id="verdict-headline" class="block text-3xl leading-none font-extrabold tracking-tight"></span>
            <span id="verdict-nuance" class="block text-3xl leading-none font-extrabold tracking-tight text-accent"></span>
          </output>

          <!-- The gauge. A margin without its ceiling is a figure without a
               scale, and this tool knows the ceiling exactly. -->
          <div id="gauge" class="hidden min-w-[220px] flex-1">
            <span class="text-[0.65rem] tracking-[0.13em] text-dim uppercase" data-i18n="gauge.title"></span>
            <div id="gauge-value" class="text-2xl leading-none font-extrabold tracking-tight text-accent tabular-nums"></div>
            <div class="gauge-track relative mt-1.5 h-[5px] rounded">
              <i id="gauge-marker" class="absolute -top-1 h-[13px] w-[2.5px] bg-fg" style="left: 0%"></i>
            </div>
            <div class="mt-1 flex justify-between text-[0.6rem] text-dim tabular-nums">
              <span>0</span>
              <span id="gauge-ceiling"></span>
            </div>
          </div>
        </div>

        <p id="verdict-detail" class="mt-3 max-w-3xl text-sm text-dim"></p>

        <!-- Full width, unlike the detail line: a sweeping bar reports how far
             a search has got, and a short one under a wide plan reads as if
             the search itself were narrow. -->
        <div id="progress" class="mt-3 hidden">
          <div class="h-1 w-full overflow-hidden rounded bg-line">
            <div class="h-full w-1/3 animate-[sweep_1.1s_ease-in-out_infinite] rounded bg-accent"></div>
          </div>
          <p id="progress-note" class="mt-1 text-xs text-dim"></p>
        </div>

        <figure class="mt-4">
          <div class="overflow-hidden rounded-lg border border-line">
            <svg
              id="plan"
              viewBox="0 0 1000 600"
              class="w-full bg-plan"
              role="img"
              data-i18n-aria="app.planLabel"
            ></svg>

            <!-- The playback bar. It is the scrubber today; the play button
                 lands with the next batch. -->
            <div class="flex flex-wrap items-center gap-3 border-t border-line bg-panel px-3 py-2">
              <button
                id="play"
                type="button"
                disabled
                class="flex items-center gap-2 rounded-full border border-accent px-3 py-1 text-xs font-bold whitespace-nowrap text-accent disabled:border-line disabled:text-dim"
              >
                <span id="play-glyph" aria-hidden="true">▶</span>
                <span id="play-label" data-i18n="play.play"></span>
              </button>

              <!-- Which gear, doubled in words. The vehicle already lights its
                   reversing lamps, but that reading should not be the only one. -->
              <span
                id="gear"
                class="hidden rounded px-2 py-0.5 text-[0.7rem] font-extrabold tracking-wider"
              ></span>

              <input
                id="scrub"
                type="range"
                min="0"
                max="100"
                value="100"
                step="1"
                disabled
                data-i18n-aria="play.scrub"
                class="min-w-24 flex-1 accent-accent"
              />

              <span class="text-xs whitespace-nowrap text-dim tabular-nums">
                <span id="scrub-label">100 %</span>
                <span id="live-clearance" class="ml-2 text-fg"></span>
              </span>
            </div>
          </div>
          <figcaption id="legend" class="mt-2 flex flex-wrap gap-4 text-xs text-dim"></figcaption>
        </figure>

        <div id="alternatives" class="mt-4 flex flex-wrap gap-2"></div>
        <dl id="stats" class="mt-4 grid gap-3 sm:grid-cols-3"></dl>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
