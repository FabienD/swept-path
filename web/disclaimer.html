<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avertissement — swept-path</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-dvh bg-ink text-fg">
    <div class="hazard-band"></div>

    <main class="mx-auto max-w-3xl px-6 py-8">
      <div class="mb-8 flex items-baseline justify-between gap-4">
        <a href="/" class="text-xs text-accent hover:underline" data-i18n="nav.back"></a>
        <select
          id="locale"
          data-i18n-aria="settings.language"
          class="rounded border border-line bg-transparent px-1.5 py-1 text-xs text-dim hover:text-fg"
        >
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>

      <h1 class="text-3xl font-extrabold tracking-tight" data-i18n="dis.title"></h1>
      <p class="mt-3 leading-relaxed" data-i18n="dis.lede"></p>

      <section class="mt-8">
        <h2 class="text-lg font-bold tracking-tight" data-i18n="dis.model.title"></h2>
        <p class="mt-2 leading-relaxed text-dim" data-i18n="dis.model.body"></p>
      </section>

      <section class="mt-8">
        <h2 class="text-lg font-bold tracking-tight" data-i18n="dis.measure.title"></h2>
        <p class="mt-2 leading-relaxed text-dim" data-i18n="dis.measure.body"></p>
      </section>

      <section class="mt-8">
        <h2 class="text-lg font-bold tracking-tight" data-i18n="dis.traffic.title"></h2>
        <p class="mt-2 leading-relaxed text-dim" data-i18n="dis.traffic.body"></p>
      </section>

      <section class="mt-8">
        <h2 class="text-lg font-bold tracking-tight" data-i18n="dis.driver.title"></h2>
        <p class="mt-2 leading-relaxed text-dim" data-i18n="dis.driver.body"></p>
      </section>

      <section class="mt-8 border-t border-line pt-6">
        <h2 class="text-lg font-bold tracking-tight" data-i18n="dis.use.title"></h2>
        <p class="mt-2 leading-relaxed text-dim" data-i18n="dis.use.body"></p>
      </section>
    </main>

    <footer class="mx-auto max-w-3xl border-t border-line px-6 py-6 text-xs text-dim">
      <nav class="flex flex-wrap gap-x-6 gap-y-2">
        <a href="/" class="hover:text-fg" data-i18n="nav.simulator"></a>
        <a href="/documentation.html" class="hover:text-fg" data-i18n="nav.documentation"></a>
        <a href="/disclaimer.html" class="hover:text-fg" data-i18n="nav.disclaimer"></a>
        <a
          href="https://github.com/FabienD/swept-path"
          class="ml-auto hover:text-fg"
          rel="noreferrer"
          >GitHub</a
        >
      </nav>
    </footer>
    <script type="module" src="/src/pages.ts"></script>
  </body>
</html>
